<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Weather: Tokyo</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    padding: 40px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
}
.card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
.card h2 { margin: 0 0 8px 0; }
.temp { font-size: 40px; font-weight: bold; margin: 8px 0; }
.label { color: #666; }
.title { text-align: center; margin-bottom: 24px; }
</style>
</head>
<body>
    <h1 class="title">Weather: Tokyo</h1>
    <div class="grid">
    <div class="card">
        <h2>Tokyo</h2>
        <p class="temp">23.34°C</p>
        <p>Scattered Clouds</p>
        <p><span class="label">Feels Like:</span> 23.06°C</p>
        <p><span class="label">Humidity:</span> 51%</p>
        <p><span class="label">Pressure:</span> 1011 hPa</p>
        <p><span class="label">Wind Speed:</span> 6.17 m/s</p>
        <hr>
        <small>Updated: 2026-05-12 08:00:05 UTC</small>
    </div>
</div>
</body>
</html>
